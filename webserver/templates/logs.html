<!DOCTYPE html>
<html>
<head>
    <title>Telegram Logs</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .logs { background: #f8f9fa; padding: 15px; border-radius: 4px; white-space: pre-wrap; font-family: monospace; }
        .button { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; }
        .button:hover { background: #5a6268; }
        .logout { margin-top: 20px; text-align: right; }
        .logout a { color: #dc3545; text-decoration: none; }
        .logout a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Telegram Logs</h1>
        <div class="logs">{{ logs }}</div>
        <a href="{{ url_for('dashboard') }}" class="button">Back to Dashboard</a>
        <div class="logout">
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>
</body>
</html>
